# mingli-document core 模块的 GraalVM Native Image 内嵌构建参数。
#
# native-image 会自动读取 classpath 上 META-INF/native-image/**/native-image.properties
# 中的 Args，因此引用本模块的应用无需手工添加这些参数。
#
# core 模块只包含无状态的 Node 模型、类型引用与 ByteArrayPool 工具：
# 类静态初始化没有 I/O、没有反射、没有线程/时间/随机数等运行期状态，
# 可以安全地在构建期完成初始化，以减少镜像运行期的类初始化开销。
#
# 如果应用需要覆盖该策略（例如做更激进的 --initialize-at-build-time），
# 可在应用侧追加 --initialize-at-run-time=com.mingliqiye.document.core 覆盖（更具体
# 的规则优先；是否支持叠加取决于 GraalVM 版本，建议先在本机验证）。
Args = --initialize-at-build-time=com.mingliqiye.document.core
