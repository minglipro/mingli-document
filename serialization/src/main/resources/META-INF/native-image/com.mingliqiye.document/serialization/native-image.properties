# mingli-document serialization 模块的 GraalVM Native Image 内嵌构建参数。
#
# native-image 会自动读取 classpath 上 META-INF/native-image/**/native-image.properties
# 中的 Args，因此引用本模块的应用无需手工添加这些参数。
#
# JavaRecordSupportLoader 负责在运行期通过 ServiceLoader 查找 record-support 模块提供的
# JavaRecordSupport 实现；是否可加载取决于运行环境（JDK 版本、classpath/module path），
# 不能固化进镜像，因此固定为运行期初始化。
# 其余序列化类没有静态运行期状态，保持默认初始化即可。
Args = --initialize-at-run-time=com.mingliqiye.document.serialization.JavaRecordSupportLoader
