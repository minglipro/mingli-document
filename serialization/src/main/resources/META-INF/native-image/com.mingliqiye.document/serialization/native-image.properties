# mingli-document serialization 模块的 GraalVM Native Image 内嵌构建参数。
#
# native-image 会自动读取 classpath 上 META-INF/native-image/**/native-image.properties
# 中的 Args，因此引用本模块的应用无需手工添加这些参数。
#
# JavaRecordSupport 是模块内唯一在静态初始化阶段做反射探测的类：
# 它在 <clinit> 里通过 Class.forName / Class#getMethod 探测 JDK 16+ 的 record API。
# 这些探测结果是宿主 JVM 的反射对象，不能固化进镜像，必须在运行期初始化。
# 其余序列化类没有静态运行期状态，保持默认（运行期）初始化即可。
Args = --initialize-at-run-time=com.mingliqiye.document.serialization.JavaRecordSupport
