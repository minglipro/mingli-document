# mingli-document 的 GraalVM Native Image 构建参数模板（应用侧，不随库 jar 发布）。
#
# JDK 版本：GraalVM 没有 JDK 8 发行版，native-image 必须用 GraalVM for JDK 17+ 构建
# （推荐 17/21/23+，常用 LTS 为 21；native 运行时最低 JDK 17）。本库 jar 仍以 JDK 8 字节码
# 发布，由 GraalVM JDK 17+ 消费即可。注意本库 Bean 属性发现依赖 java.beans.Introspector，
# 该路径建议使用 GraalVM for JDK 22+（推荐最新版本）。
#
# 参数作用域说明：
#   - GraalVM 明确要求：嵌入 jar 的 native-image.properties 中，--link-at-build-time 引用的
#     类/包必须来自同一个 jar（本库不使用该选项）。
#   - 对 --initialize-at-build-time / --initialize-at-run-time，嵌入 jar 时建议只引用「该 jar
#     自己的类」；不同 GraalVM 版本对嵌入参数的作用域、覆盖顺序有差异。
#   - 因此下面的参数（引用库类 com.mingliqiye.document.* 与 JDK 类 java.beans.*）推荐加到
#     native-image 命令行、Gradle buildArgs 或 Maven buildArg 中；如果复制到应用自己的
#     src/main/resources/META-INF/native-image/<groupId>/<artifactId>/native-image.properties，
#     请先在目标 GraalVM 版本上验证（--verbose 可查看最终生效的配置）。
#   - 库自身的初始化参数已内嵌在 core / serialization jar 中（只引用本 jar 的类），随 jar 自动生效。
#
# 另外：native-image.properties 只有在 classpath 的 META-INF/native-image 目录下才会被
# 自动读取；把本文件放在普通目录（如 graalvm/）不会自动加载，请按上面的方式传参。

Args = --initialize-at-run-time=com.mingliqiye.document.serialization.JavaRecordSupportLoader \
       --initialize-at-run-time=java.beans.Introspector \
       -H:+ReportExceptionStackTraces

# ---------------------------------------------------------------------------
# 可选参数（按需启用；部分 GraalVM 版本需要先加 -H:+UnlockExperimentalVMOptions）
#
# -H:+ReportExceptionStackTraces   已在上面启用：构建期异常输出完整堆栈，便于排查配置问题。
#
# -H:+AddAllCharsets               字符集：DocumentMapperConfig.fileCharset 使用非 UTF-8
#                                  （如 GBK/GB18030）或格式模块读取非默认字符集数据时启用。
#                                  默认镜像只包含 UTF-8 / UTF-16 / ISO-8859-1 / US-ASCII。
#
# -H:+IncludeAllLocales            Locale：DateTimeFormatter / NumberFormat / 大小写转换
#                                  使用非默认 Locale 时需要。
#
# -H:+IncludeAllTimeZones          时区：日期时间转换使用非构建机默认时区，或运行期依赖
#                                  user.timezone 时需要（默认只包含 UTC、GMT 与构建机时区）。
#
# 启用方式举例（合并进同一条 Args，用反斜杠续行；按上面的说明加到命令行/buildArgs）：
#   Args = --initialize-at-run-time=com.mingliqiye.document.serialization.JavaRecordSupportLoader \
#          --initialize-at-run-time=java.beans.Introspector \
#          -H:+ReportExceptionStackTraces \
#          -H:+AddAllCharsets -H:+IncludeAllLocales -H:+IncludeAllTimeZones
# ---------------------------------------------------------------------------
